apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: require-resource-limits
  namespace: devops-lab
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/category: Inventory API Runtime Security
spec:
  validationActions:
  - Deny
  failurePolicy: Fail
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
      - pods/ephemeralcontainers
      - replicationcontrollers
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    - apiGroups:
      - batch
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - jobs
      - cronjobs
  variables:
  - name: podSpec
    expression: |-
      request.kind.kind == 'Pod' ? object.spec : (request.kind.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec : object.spec.template.spec)
  - name: containers
    expression: |-
      variables.podSpec.containers + (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers : [])
  validations:
  - expression: |-
      variables.containers.all(c,
        has(c.resources) && has(c.resources.limits)
        && 'cpu' in c.resources.limits && 'memory' in c.resources.limits
        && quantity(c.resources.limits['cpu']).compareTo(quantity('0')) > 0
        && quantity(c.resources.limits['memory']).compareTo(quantity('0')) > 0)
    message: Every regular and init container must declare positive CPU and memory limits.
  matchConditions:
  - name: application-namespace-only
    expression: request.namespace == 'devops-lab'
