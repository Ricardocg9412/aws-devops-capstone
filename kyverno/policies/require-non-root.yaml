apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: require-non-root
  namespace: devops-lab
  annotations:
    policies.kyverno.io/title: Require Non Root
    policies.kyverno.io/category: Inventory API Runtime Security
spec:
  validationActions:
  - Deny
  failurePolicy: Fail
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
      - pods/ephemeralcontainers
      - replicationcontrollers
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    - apiGroups:
      - batch
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - jobs
      - cronjobs
  variables:
  - name: podSpec
    expression: |-
      request.kind.kind == 'Pod' ? object.spec : (request.kind.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec : object.spec.template.spec)
  - name: containers
    expression: |-
      variables.podSpec.containers + (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers : []) + (has(variables.podSpec.ephemeralContainers) ? variables.podSpec.ephemeralContainers : [])
  validations:
  - expression: |-
      variables.containers.all(c,
        (has(c.securityContext) && has(c.securityContext.runAsNonRoot)
          ? c.securityContext.runAsNonRoot
          : (has(variables.podSpec.securityContext) && has(variables.podSpec.securityContext.runAsNonRoot) && variables.podSpec.securityContext.runAsNonRoot))
        && (has(c.securityContext) && has(c.securityContext.runAsUser)
          ? c.securityContext.runAsUser != 0
          : !(has(variables.podSpec.securityContext) && has(variables.podSpec.securityContext.runAsUser) && variables.podSpec.securityContext.runAsUser == 0)))
    message: Containers must declare effective runAsNonRoot=true and must not use effective UID 0.
  matchConditions:
  - name: application-namespace-only
    expression: request.namespace == 'devops-lab'
