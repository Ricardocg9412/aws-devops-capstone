name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test application with statement coverage
        run: >-
          python -m pytest tests/ -v
          --junitxml=reports/pytest.xml
          --cov=app --cov-fail-under=80
          --cov-report=term-missing
          --cov-report=xml:reports/coverage.xml
          --cov-report=html:reports/htmlcov
      - name: Preserve test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-test-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  terraform-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.16.6'
          terraform_wrapper: false
      - name: Check formatting, initialize without backend, validate, and run mocked tests
        run: ./scripts/terraform-validate.sh

  helm-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install chart test dependencies
        run: python -m pip install -r requirements-dev.txt
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: 'v4.3.1'
      - name: Lint default, dev, and prod values
        run: |
          helm lint --strict helm/inventory-api
          helm lint --strict helm/inventory-api -f helm/inventory-api/values-dev.yaml
          helm lint --strict helm/inventory-api -f helm/inventory-api/values-prod.yaml
      - name: Render default, dev, and prod values
        run: |
          helm template inventory-api helm/inventory-api --namespace devops-lab > /tmp/default.yaml
          helm template inventory-api helm/inventory-api --namespace devops-lab -f helm/inventory-api/values-dev.yaml > /tmp/dev.yaml
          helm template inventory-api helm/inventory-api --namespace devops-lab -f helm/inventory-api/values-prod.yaml > /tmp/prod.yaml
      - name: Test chart defaults, profiles, security, HPA, and invalid values
        run: python -m unittest discover -s helm/inventory-api/tests -v

  kyverno-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run local CEL policy tests using matching Kyverno CLI
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            --workdir /work \
            reg.kyverno.io/kyverno/kyverno-cli:v1.19.2 \
            test kyverno/tests

  docker-build: 
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        name: Dir checkout
        with:
          persist-credentials: false

