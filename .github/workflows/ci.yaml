name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test application with statement coverage
        run: >-
          python -m pytest tests/ -v
          --junitxml=reports/pytest.xml
          --cov=app --cov-fail-under=80
          --cov-report=term-missing
          --cov-report=xml:reports/coverage.xml
          --cov-report=html:reports/htmlcov
      - name: Preserve test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-test-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  terraform-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.16.6'
          terraform_wrapper: false
      - name: Check formatting, initialize without backend, validate, and run mocked tests
        run: ./scripts/terraform-validate.sh

  helm-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install chart test dependencies
        run: python -m pip install -r requirements-dev.txt
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: 'v4.3.1'
      - name: Lint default, dev, and prod values
        run: |
          helm lint --strict helm/inventory-api
          helm lint --strict helm/inventory-api -f helm/inventory-api/values-dev.yaml
          helm lint --strict helm/inventory-api -f helm/inventory-api/values-prod.yaml
      - name: Render default, dev, and prod values
        run: |
          helm template inventory-api helm/inventory-api --namespace devops-lab > /tmp/default.yaml
          helm template inventory-api helm/inventory-api --namespace devops-lab -f helm/inventory-api/values-dev.yaml > /tmp/dev.yaml
          helm template inventory-api helm/inventory-api --namespace devops-lab -f helm/inventory-api/values-prod.yaml > /tmp/prod.yaml
      - name: Test chart defaults, profiles, security, HPA, and invalid values
        run: python -m unittest discover -s helm/inventory-api/tests -v

  kyverno-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run local CEL policy tests using matching Kyverno CLI
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            --workdir /work \
            reg.kyverno.io/kyverno/kyverno-cli:v1.19.2 \
            test kyverno/tests

  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build SHA-tagged image without publishing
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          tags: inventory-api:${{ github.sha }}
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/inventory-api.tar
          cache-from: type=gha,scope=inventory-api-linux-amd64
          cache-to: type=gha,mode=max,scope=inventory-api-linux-amd64
      - name: Record archive checksum and Docker image identity
        env:
          IMAGE_REF: inventory-api:${{ github.sha }}
        run: |
          cd "$RUNNER_TEMP"
          sha256sum inventory-api.tar > inventory-api.tar.sha256
          docker load --input inventory-api.tar
          docker image inspect "$IMAGE_REF" --format '{{.Id}}' > image-id.txt
      # This artifact is a test input, not a published or approved release.
      - name: Preserve the exact built image for downstream jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inventory-image-${{ github.sha }}
          path: |
            ${{ runner.temp }}/inventory-api.tar
            ${{ runner.temp }}/inventory-api.tar.sha256
            ${{ runner.temp }}/image-id.txt
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  image-scan:
    needs: docker-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: inventory-image-${{ github.sha }}
          path: ${{ runner.temp }}/image
      - name: Verify built archive integrity
        working-directory: ${{ runner.temp }}/image
        run: sha256sum --check inventory-api.tar.sha256
      - name: Reject HIGH and CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          version: v0.76.1
          scan-type: image
          input: ${{ runner.temp }}/image/inventory-api.tar
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: json
          output: ${{ runner.temp }}/trivy-image.json
          timeout: 10m
          cache: false
      - name: Preserve vulnerability report even if the gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-vulnerability-report-${{ github.sha }}
          path: ${{ runner.temp }}/trivy-image.json
          retention-days: 14
          if-no-files-found: warn

  integration-test:
    needs: [docker-build, image-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: inventory-image-${{ github.sha }}
          path: ${{ runner.temp }}/image
      - name: Load and verify the exact scanned image without rebuilding
        working-directory: ${{ runner.temp }}/image
        env:
          IMAGE_REF: inventory-api:${{ github.sha }}
        run: |
          sha256sum --check inventory-api.tar.sha256
          docker load --input inventory-api.tar
          actual_id=$(docker image inspect "$IMAGE_REF" --format '{{.Id}}')
          test "$actual_id" = "$(cat image-id.txt)"
      - name: Exercise container liveness and readiness with runtime hardening
        env:
          IMAGE_REF: inventory-api:${{ github.sha }}
        run: ./scripts/image-integration-test.sh "$IMAGE_REF"
