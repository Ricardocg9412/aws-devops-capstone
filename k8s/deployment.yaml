apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: devops-lab
  labels:
    app: inventory-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-api
  template:
    metadata:
      labels:
        app: inventory-api
    spec:
      containers:
      - name: inventory-api
        image: inventory-api:1.0
        ports:
          - containerPort: 8080
        resources:
          requests:
            cpu: "250m"      # 0.25 de un core de CPU garantizado
            memory: "512Mi"   # 512 Megabytes de RAM garantizados
          limits:
            cpu: "1000m"    # Tope máximo de 1 core de CPU
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
          successThreshold: 1
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3


