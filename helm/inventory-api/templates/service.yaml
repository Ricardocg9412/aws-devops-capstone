apiVersion: v1
kind: Service
metadata:
  name: {{ include "inventory-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inventory-api.labels" . | nindent 4 }}
  {{- with mergeOverwrite (deepCopy .Values.commonAnnotations) .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "inventory-api.selectorLabels" . | nindent 4 }}
